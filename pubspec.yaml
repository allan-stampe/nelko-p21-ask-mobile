name: nelko_p21_ask_mobile
description: Offline NELKO P21 text labels and Bluetooth diagnostics. No cloud. No account. Just print.
publish_to: none
version: 0.0.2+2
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/licenses/Mobile-MIT.txt
    - assets/licenses/Windows-MIT.txt
    - assets/fonts/Go-Regular.ttf
    - assets/licenses/Go-Fonts.txt
