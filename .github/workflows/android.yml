name: Android experimental APK
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Disable SDK analytics and verify version
        run: |
          flutter config --no-analytics
          flutter --version
          python3 - <<'PY'
          import os
          from pathlib import Path
          assert 'version: 0.0.2+2' in Path('pubspec.yaml').read_text()
          if os.environ['GITHUB_REF_TYPE']=='tag':
              assert os.environ['GITHUB_REF_NAME']=='v0.0.2'
          PY
      - name: Prepare standard pinned Flutter Android infrastructure
        run: tool/bootstrap_android.sh
      - name: Resolve pinned-SDK dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --fatal-infos
      - name: Flutter unit and widget tests
        run: flutter test --coverage
      - name: Check offline manifest
        run: python3 tool/check_privacy.py
      - name: Build installable experimental APK
        run: flutter build apk --release --no-pub
      - name: Android lint and merged APK privacy check
        run: |
          cd android
          ./gradlew lintRelease
          cd ..
          python3 tool/check_privacy.py --apk build/app/outputs/flutter-apk/app-release.apk --apkanalyzer "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
      - name: Verify signing and package download
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/NELKO-P21-ASK-Mobile-v0.0.2-experimental.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$signer" verify --print-certs dist/NELKO-P21-ASK-Mobile-v0.0.2-experimental.apk > dist/APK-CERTIFICATE.txt
          cp LICENSE README.md CHANGELOG.md ROADMAP.md THIRD_PARTY_NOTICES.md dist/
          cp docs/PROTOCOL.md docs/HARDWARE-TEST.md docs/DECISIONS.md docs/TEXT-PRINTING-v0.0.2.md dist/
          cp assets/licenses/Go-Fonts.txt dist/GO-FONTS-LICENSE.txt
          cd dist
          sha256sum NELKO-P21-ASK-Mobile-v0.0.2-experimental.apk > SHA256SUMS.txt
          zip NELKO-P21-ASK-Mobile-v0.0.2-experimental.zip *
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-and-source-lock
          path: |
            pubspec.lock
            android/gradlew
            android/gradlew.bat
            android/gradle/wrapper/*
            android/settings.gradle.kts
            android/build.gradle.kts
            android/gradle.properties
            coverage/lcov.info
            build/app/reports/lint-results-release.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: NELKO-P21-ASK-Mobile-v0.0.2-experimental
          path: dist/*
          if-no-files-found: error
  install-smoke:
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [31, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: NELKO-P21-ASK-Mobile-v0.0.2-experimental
          path: dist
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: tool/emulator_install_smoke.sh dist/NELKO-P21-ASK-Mobile-v0.0.2-experimental.apk work/emulator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-smoke-api-${{ matrix.api }}
          path: work/emulator
  release:
    needs: [verify-build, install-smoke]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NELKO-P21-ASK-Mobile-v0.0.2-experimental
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: NELKO P21 – ASK Mobile Edition v0.0.2 (EXPERIMENTAL)
          body_path: docs/RELEASE-v0.0.2.md
          prerelease: true
          draft: false
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/NELKO-P21-ASK-Mobile-v0.0.2-experimental.apk
            dist/NELKO-P21-ASK-Mobile-v0.0.2-experimental.zip
            dist/SHA256SUMS.txt
            dist/APK-CERTIFICATE.txt
