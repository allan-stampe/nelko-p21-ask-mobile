name: Android experimental APK
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Disable SDK analytics and verify version
        run: |
          flutter config --no-analytics
          flutter --version
          python3 - <<'PY'
          import os
          from pathlib import Path
          assert 'version: 0.0.1+1' in Path('pubspec.yaml').read_text()
          if os.environ['GITHUB_REF_TYPE']=='tag':
              assert os.environ['GITHUB_REF_NAME']=='v0.0.1'
          PY
      - name: Prepare standard pinned Flutter Android infrastructure
        run: tool/bootstrap_android.sh
      - name: Resolve pinned-SDK dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --fatal-infos
      - name: Flutter unit and widget tests
        run: flutter test --coverage
      - name: Check offline manifest
        run: python3 tool/check_privacy.py
      - name: Build installable experimental APK
        run: flutter build apk --release --no-pub
      - name: Android lint and merged APK privacy check
        run: |
          cd android
          ./gradlew lintRelease
          cd ..
          python3 tool/check_privacy.py --apk build/app/outputs/flutter-apk/app-release.apk --apkanalyzer "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
      - name: Verify signing and package download
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/NELKO-P21-ASK-Mobile-v0.0.1-experimental.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$signer" verify --print-certs dist/NELKO-P21-ASK-Mobile-v0.0.1-experimental.apk > dist/APK-CERTIFICATE.txt
          cp LICENSE README.md CHANGELOG.md ROADMAP.md THIRD_PARTY_NOTICES.md dist/
          cp docs/PROTOCOL.md docs/HARDWARE-TEST.md docs/DECISIONS.md dist/
          cd dist
          sha256sum NELKO-P21-ASK-Mobile-v0.0.1-experimental.apk > SHA256SUMS.txt
          zip NELKO-P21-ASK-Mobile-v0.0.1-experimental.zip *
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-and-source-lock
          path: |
            pubspec.lock
            android/gradlew
            android/gradlew.bat
            android/gradle/wrapper/*
            android/settings.gradle.kts
            android/build.gradle.kts
            android/gradle.properties
            coverage/lcov.info
            build/app/reports/lint-results-release.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: NELKO-P21-ASK-Mobile-v0.0.1-experimental
          path: dist/*
          if-no-files-found: error
  release:
    needs: verify-build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NELKO-P21-ASK-Mobile-v0.0.1-experimental
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: NELKO P21 – ASK Mobile Edition v0.0.1 (EXPERIMENTAL)
          body_path: docs/RELEASE-v0.0.1.md
          prerelease: true
          draft: false
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/NELKO-P21-ASK-Mobile-v0.0.1-experimental.apk
            dist/NELKO-P21-ASK-Mobile-v0.0.1-experimental.zip
            dist/SHA256SUMS.txt
            dist/APK-CERTIFICATE.txt
